version: '3.8'

services:
  harmony-agent:
    image: ghcr.io/runbeam/harmony-agent:latest
    container_name: harmony-agent
    restart: unless-stopped
    
    # Required capabilities for WireGuard
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
    
    # Network mode
    network_mode: host
    
    # Volumes
    volumes:
      - ./config:/etc/harmony-agent:ro
      - ./keys:/etc/harmony-agent/keys:ro
      - harmony-agent-run:/var/run
    
    # Environment variables
    environment:
      - RUST_LOG=info
      - harmony_agent_LOG_LEVEL=info
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

volumes:
  harmony-agent-run:
  prometheus-data:
